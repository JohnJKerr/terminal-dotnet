name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The patch number counts commits, so the full history is needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore from the lock files
        run: dotnet restore TerminalDotnet.slnx -m:1 --locked-mode

      - name: Build
        run: dotnet build TerminalDotnet.slnx -m:1 --no-restore

      - name: Test
        run: dotnet test TerminalDotnet.slnx -m:1 --no-build

      - name: Check for vulnerable packages
        shell: bash
        run: |
          dotnet list TerminalDotnet.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q 'has the following vulnerable packages' vulnerable.txt
