name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The patch number comes from the run number, so each build is versioned
      # separately; major and minor stay in Directory.Build.props.
      - name: Build
        run: dotnet build TerminalDotnet.slnx -m:1 -p:BuildNumber=${{ github.run_number }}

      - name: Test
        run: dotnet test TerminalDotnet.slnx -m:1 --no-build -p:BuildNumber=${{ github.run_number }}
